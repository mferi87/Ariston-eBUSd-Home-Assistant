# ==============================================================================
# Ariston Gas Consumption Dashboard Cards (Matching Ariston Net Portal)
# ==============================================================================

# ------------------------------------------------------------------------------
# OPTION 1: Built-in Native Statistics Bar Chart (Recommended for Mobile & Web)
# (100% native Home Assistant card - zero plugins/HACS required, works everywhere)
# ------------------------------------------------------------------------------
type: statistics-graph
title: Daily Gas Consumption (Sm³)
days_to_show: 30
stat_types:
  - change
chart_type: bar
entities:
  - entity: sensor.ariston_heating_gas_total
    name: Heating (Sm³)
  - entity: sensor.ariston_dhw_gas_total
    name: Domestic Hot Water (Sm³)

---

# ------------------------------------------------------------------------------
# OPTION 2: ApexCharts Card (Real-time daily gas bar chart including today)
# ------------------------------------------------------------------------------
type: custom:apexcharts-card
header:
  show: true
  title: Gas Consumption (Sm³)
  show_states: true
  colorize_states: true
graph_span: 7d
span:
  end: day
  offset: +1d
stacked: true
apex_config:
  chart:
    type: bar
  legend:
    show: true
    position: bottom
  yaxis:
    decimalsInFloat: 2
series:
  - entity: sensor.ariston_heating_gas_daily
    name: Heating
    color: "#ff7043"
    type: column
    float_precision: 2
    group_by:
      func: max
      duration: 1d

  - entity: sensor.ariston_dhw_gas_daily
    name: Domestic hot water
    color: "#1e88e5"
    type: column
    float_precision: 2
    group_by:
      func: max
      duration: 1d
