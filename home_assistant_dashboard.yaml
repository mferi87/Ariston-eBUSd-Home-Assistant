  - title: Boiler & Heating
    icon: mdi:water-boiler
    cards: []
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: thermostat
            entity: climate.ariston_heating
            name: Zone 1 Heating
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - heat
                  - 'off'
      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.ebusd_boiler_boiler_pressure
                name: Boiler Pressure
                unit: bar
                min: 0
                max: 3
                needle: true
                severity:
                  red: 0
                  green: 1
                  yellow: 2
              - type: entities
                title: Boiler Overview
                entities:
                  - entity: sensor.ebusd_boiler_boiler_status
                    name: Operating State
                    icon: mdi:information-outline
                  - entity: binary_sensor.ebusd_boiler_flame_active
                    name: Burner Flame
                    icon: mdi:fire
                  - entity: sensor.ebusd_boiler_diverter_valve
                    name: Diverter Valve
                    icon: mdi:valve
                  - entity: switch.ebusd_energymgr_dhw_status
                    name: Hot Water Production
                    icon: mdi:shower
      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: history-graph
            title: Ambient Temperatures
            hours_to_show: 24
            refresh_interval: 30
            entities:
              - entity: sensor.ebusd_energymgr_z1_room_temp_f
                name: Room Temperature (Sensys HD)
              - entity: sensor.ebusd_energymgr_ext_temp
                name: Outdoor Temperature
      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: history-graph
            title: Heating Water Temperatures
            hours_to_show: 24
            refresh_interval: 30
            entities:
              - entity: sensor.ebusd_energymgr_z1_target_f
                name: Target Flow Temp
              - entity: sensor.ebusd_boiler_ewt_temp
                name: Return Temp (EWT)
      - type: grid
        cards:
          - type: history-graph
            entities:
              - entity: sensor.ebusd_boiler_flame_power_kw
                name: Flame Power (kW)
              - entity: sensor.ebusd_boiler_boiler_current_modulation
                name: Gas Modulation (%)
            title: Burner Power & Modulation
            hours_to_show: 24
            refresh_interval: 30
      - type: grid
        cards:
          - type: heading
            heading: New section
